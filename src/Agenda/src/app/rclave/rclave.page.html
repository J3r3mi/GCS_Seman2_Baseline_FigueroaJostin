<ion-header>

  <ion-toolbar>

    <ion-title>
      Recuperar clave
    </ion-title>

  </ion-toolbar>

</ion-header>


<ion-content class="ion-padding">

<h2 style="text-align:center;">
Recuperar contraseña
</h2>

<p style="text-align:center; color:gray;">
Ingrese su cédula y una nueva contraseña
</p>


<ion-item>

<ion-input
label="Cédula"
[(ngModel)]="cedula">

</ion-input>

</ion-item>


<ion-item>

<ion-input
type="password"
label="Nueva contraseña"
[(ngModel)]="contrasena">

</ion-input>

</ion-item>


<ion-button
expand="block"
(click)="recuperar()">

Cambiar contraseña

</ion-button>


</ion-content>
